apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn-analytics
  namespace: cdn-analytics
  labels:
    app: cdn-analytics
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cdn-analytics
  template:
    metadata:
      labels:
        app: cdn-analytics
    spec:
      containers:
        - name: app
          image: cdn-analytics-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
            - containerPort: 3000
              name: api
          envFrom:
            - configMapRef:
                name: cdn-analytics-config
            - secretRef:
                name: cdn-analytics-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}