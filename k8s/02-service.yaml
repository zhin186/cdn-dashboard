apiVersion: v1
kind: Service
metadata:
  name: cdn-analytics
  namespace: cdn-analytics
  labels:
    app: cdn-analytics
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: cdn-analytics
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdn-analytics
  namespace: cdn-analytics
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cdn-analytics.yourdomain.com
      secretName: cdn-analytics-tls
  rules:
    - host: cdn-analytics.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cdn-analytics
                port:
                  number: 80